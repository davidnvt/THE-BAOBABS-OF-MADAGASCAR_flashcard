            { w: "regeneration", lvl: "C1", ipa: "/rɪˌdʒen.əˈreɪ.ʃən/", vn: "Tái sinh", syn: "renewal, regrowth", ex_en: "The regeneration of the forest after the fire took many years.", ex_vn: "Quá trình tái sinh của khu rừng sau đám cháy mất nhiều năm." },
            { w: "resistance to", lvl: "C1", ipa: "/rɪˈzɪs.təns tuː/", vn: "Sự kháng cự với", syn: "defense against, immunity to", ex_en: "The bacteria have developed resistance to antibiotics.", ex_vn: "Vi khuẩn đã phát triển sự kháng cự với thuốc kháng sinh." },
            { w: "eventually", lvl: "B2", ipa: "/ɪˈven.tʃu.ə.li/", vn: "Cuối cùng", syn: "finally, ultimately", ex_en: "After many delays, the train eventually arrived.", ex_vn: "Sau nhiều lần trì hoãn, cuối cùng chuyến tàu cũng đã đến." },
            { w: "disturbance", lvl: "C1", ipa: "/dɪˈstɜː.bəns/", vn: "Sự xáo trộn", syn: "disruption, interference", ex_en: "Any disturbance in the classroom will result in punishment.", ex_vn: "Bất kỳ sự xáo trộn nào trong lớp học sẽ dẫn đến hình phạt." },
            { w: "promote", lvl: "B2", ipa: "/prəˈməʊt/", vn: "Thúc đẩy", syn: "encourage, boost", ex_en: "Regular exercise can promote good health.", ex_vn: "Tập thể dục thường xuyên có thể thúc đẩy sức khỏe tốt." },
            { w: "rapid", lvl: "B2", ipa: "/ˈræp.ɪd/", vn: "Nhanh chóng", syn: "fast, swift", ex_en: "The country is experiencing rapid economic growth.", ex_vn: "Đất nước đang trải qua sự tăng trưởng kinh tế nhanh chóng." },
            { w: "spread", lvl: "B2", ipa: "/spred/", vn: "Lan rộng", syn: "expand, extend", ex_en: "The news of the victory spread quickly across the city.", ex_vn: "Tin tức về chiến thắng lan rộng nhanh chóng khắp thành phố." },
            { w: "germination", lvl: "C1", ipa: "/ˌdʒɜː.mɪˈneɪ.ʃən/", vn: "Sự nảy mầm", syn: "sprouting, budding", ex_en: "Seeds need water and warmth for germination.", ex_vn: "Hạt giống cần nước và sự ấm áp để nảy mầm." },
            { w: "dispersal", lvl: "C1", ipa: "/dɪˈspɜː.səl/", vn: "Sự phân tán", syn: "scattering, distribution", ex_en: "The wind is responsible for the dispersal of these seeds.", ex_vn: "Gió chịu trách nhiệm cho sự phân tán của những hạt giống này." },
            { w: "absence", lvl: "B2", ipa: "/ˈæb.səns/", vn: "Sự vắng mặt, thiếu", syn: "lack, nonappearance", ex_en: "His absence from the meeting was noticed by everyone.", ex_vn: "Sự vắng mặt của anh ấy trong cuộc họp đã được mọi người chú ý." },
            { w: "extinct", lvl: "C1", ipa: "/ɪkˈstɪŋkt/", vn: "Tuyệt chủng", syn: "died out, vanished", ex_en: "Dinosaurs became extinct millions of years ago.", ex_vn: "Khủng long đã tuyệt chủng hàng triệu năm trước." },
            { w: "concerned", lvl: "C1", ipa: "/kənˈsɜːnd/", vn: "Lo lắng, quan tâm", syn: "worried, anxious", ex_en: "Parents are concerned about their children's safety online.", ex_vn: "Các bậc cha mẹ lo lắng về sự an toàn của con cái họ trên mạng." },
            { w: "intact", lvl: "C1", ipa: "/ɪnˈtækt/", vn: "Nguyên vẹn", syn: "whole, undamaged", ex_en: "Despite the accident, the car remained largely intact.", ex_vn: "Bất chấp vụ tai nạn, chiếc xe vẫn còn nguyên vẹn phần lớn." },
            { w: "habitat", lvl: "B2", ipa: "/ˈhæb.ɪ.tæt/", vn: "Môi trường sống", syn: "environment, home", ex_en: "The natural habitat of the tiger is shrinking due to deforestation.", ex_vn: "Môi trường sống tự nhiên của hổ đang bị thu hẹp do nạn phá rừng." },
            { w: "distribution", lvl: "C1", ipa: "/ˌdɪs.trɪˈbjuː.ʃən/", vn: "Sự phân bố", syn: "allocation, spread", ex_en: "The distribution of wealth in the country is very unequal.", ex_vn: "Sự phân bố của cải trong nước rất không đồng đều." },
            { w: "swift", lvl: "C1", ipa: "/swɪft/", vn: "Nhanh chóng", syn: "quick, rapid", ex_en: "The government took swift action to help the victims.", ex_vn: "Chính phủ đã có hành động nhanh chóng để giúp đỡ các nạn nhân." },
            { w: "conservation", lvl: "B2", ipa: "/ˌkɒn.səˈveɪ.ʃən/", vn: "Bảo tồn", syn: "preservation, protection", ex_en: "Wildlife conservation is essential to protect endangered species.", ex_vn: "Bảo tồn động vật hoang dã là điều cần thiết để bảo vệ các loài có nguy cơ tuyệt chủng." }
        ];

        // DOM Elements
        const flashcard = document.getElementById('flashcard');
        const wordDisplay = document.getElementById('wordDisplay');
        const ipaDisplay = document.getElementById('ipaDisplay');
        const meaningDisplay = document.getElementById('meaningDisplay');
        const synonymDisplay = document.getElementById('synonymDisplay');
        const exampleEnDisplay = document.getElementById('exampleEnDisplay');
        const exampleVnDisplay = document.getElementById('exampleVnDisplay');
        const levelDisplay = document.getElementById('levelDisplay');
        const counterDisplay = document.getElementById('counterDisplay');
        const progressFill = document.getElementById('progressFill');

        // State
        let currentIndex = 0;
        let isFlipped = false;
        let shuffledList = [...vocabulary];

        // Initialize
        function init() {
            updateCard();
            updateProgress();
        }

        // Update card content
        function updateCard() {
            const item = shuffledList[currentIndex];
            wordDisplay.textContent = item.w;
            ipaDisplay.textContent = item.ipa;
            meaningDisplay.textContent = item.vn;
            synonymDisplay.textContent = `🔁 ${item.syn}`;
            exampleEnDisplay.textContent = item.ex_en;
            exampleVnDisplay.textContent = item.ex_vn;
            levelDisplay.textContent = item.lvl;
            counterDisplay.textContent = `${currentIndex + 1} / ${shuffledList.length}`;
            
            // Reset flip state
            if (isFlipped) {
                flashcard.classList.remove('flipped');
                isFlipped = false;
            }
        }

        // Update progress bar
        function updateProgress() {
            const percent = ((currentIndex + 1) / shuffledList.length) * 100;
            progressFill.style.width = `${percent}%`;
        }

        // Toggle flip
        function toggleFlip() {
            flashcard.classList.toggle('flipped');
            isFlipped = !isFlipped;
        }

        // Next card
        function nextCard() {
            if (currentIndex < shuffledList.length - 1) {
                currentIndex++;
                updateCard();
                updateProgress();
            }
        }

        // Previous card
        function prevCard() {
            if (currentIndex > 0) {
                currentIndex--;
                updateCard();
                updateProgress();
            }
        }

        // Speak word
        function speakWord() {
            const word = shuffledList[currentIndex].w;
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(word);
            utterance.lang = 'en-GB';
            utterance.rate = 0.9;
            window.speechSynthesis.speak(utterance);
        }

        // Shuffle list
        function shuffleList() {
            for (let i = shuffledList.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffledList[i], shuffledList[j]] = [shuffledList[j], shuffledList[i]];
            }
            currentIndex = 0;
            updateCard();
            updateProgress();
        }

        // Reset
        function resetList() {
            shuffledList = [...vocabulary];
            currentIndex = 0;
            updateCard();
            updateProgress();
        }

        // Event Listeners
        flashcard.addEventListener('click', toggleFlip);
        document.getElementById('flipBtn').addEventListener('click', toggleFlip);
        document.getElementById('nextBtn').addEventListener('click', nextCard);
        document.getElementById('prevBtn').addEventListener('click', prevCard);
        document.getElementById('speakBtn').addEventListener('click', speakWord);
        document.getElementById('shuffleBtn').addEventListener('click', shuffleList);
        document.getElementById('resetBtn').addEventListener('click', resetList);

        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') nextCard();
            if (e.key === 'ArrowLeft') prevCard();
            if (e.key === ' ') {
                e.preventDefault();
                toggleFlip();
            }
        });

        // Start
        init();
    </script>
</body>
</html>
